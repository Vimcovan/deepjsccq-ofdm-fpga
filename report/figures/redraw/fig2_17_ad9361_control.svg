<polygon points="1370,520 1375.0,508.0 1365.0,508.0" fill="#000000"/>
<polyline points="1370,675 1370,715" fill="none" stroke="#000000" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="1370,715 1375.0,703.0 1365.0,703.0" fill="#000000"/>
<polyline points="1370,815 1370,855" fill="none" stroke="#000000" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="1370,855 1375.0,843.0 1365.0,843.0" fill="#000000"/>
<polyline points="1370,975 1370,995" fill="none" stroke="#000000" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="1370,995 1375.0,983.0 1365.0,983.0" fill="#000000"/>
<polyline points="1370,1095 1370,1135" fill="none" stroke="#000000" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="1370,1135 1375.0,1123.0 1365.0,1123.0" fill="#000000"/>
