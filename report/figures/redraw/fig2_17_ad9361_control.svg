<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1660" viewBox="0 0 1900 1660" role="img">
<title>AD9361 控制：SPI 总线归属与 TX 正交校准</title>
<rect width="1900" height="1660" fill="white"/>
<text x="435" y="52" xml:space="preserve" text-anchor="middle" font-size="35" fill="#000000"><tspan font-family="Times New Roman">(a) SPI </tspan><tspan font-family="SimSun">总线归属</tspan></text>
<text x="435" y="96" xml:space="preserve" text-anchor="middle" font-size="29" fill="#000000"><tspan font-family="Times New Roman">TX </tspan><tspan font-family="SimSun">结构</tspan><tspan font-family="Times New Roman"> · 20 MHz </tspan><tspan font-family="SimSun">控制时钟域</tspan></text>
<text x="1370" y="52" xml:space="preserve" text-anchor="middle" font-size="35" fill="#000000"><tspan font-family="Times New Roman">(b) TX </tspan><tspan font-family="SimSun">正交校准相位扫描</tspan></text>
<text x="1370" y="96" xml:space="preserve" text-anchor="middle" font-size="29" fill="#000000"><tspan font-family="Times New Roman">PL </tspan><tspan font-family="SimSun">中实现</tspan></text>
