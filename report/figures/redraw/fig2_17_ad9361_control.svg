<text x="435.0" y="264" xml:space="preserve" text-anchor="middle" font-size="27" fill="#000000"><tspan font-family="Times New Roman">ad9361_txq_search</tspan></text>
<rect x="610.0" y="180" width="240" height="110" rx="12" fill="#EBF1DF" stroke="#50632A" stroke-width="2"/>
<text x="730.0" y="222" xml:space="preserve" text-anchor="middle" font-size="29" fill="#000000"><tspan font-family="Segoe UI Symbol">③</tspan><tspan font-family="Times New Roman"> PS </tspan><tspan font-family="SimSun">单次读写</tspan></text>
<text x="730.0" y="264" xml:space="preserve" text-anchor="middle" font-size="27" fill="#000000"><tspan font-family="Times New Roman">SPI </tspan><tspan font-family="SimSun">命令寄存器</tspan></text>
<polygon points="300,360 570,360 525,445 345,445" fill="#EBE7F2" stroke="#574781" stroke-width="2"/>
