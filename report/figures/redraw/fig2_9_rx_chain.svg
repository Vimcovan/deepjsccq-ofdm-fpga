<text x="720" y="728" xml:space="preserve" text-anchor="start" font-size="27" fill="#000000"><tspan font-family="SimSun">残差</tspan><tspan font-family="Times New Roman">e</tspan><tspan font-family="SimSun">：每符号一次</tspan></text>
<text x="720" y="764" xml:space="preserve" text-anchor="start" font-size="27" fill="#000000"><tspan font-family="SimSun">用于下一符号的二阶环更新</tspan></text>
<text x="220" y="1138" xml:space="preserve" text-anchor="middle" font-size="28" fill="#000000"><tspan font-family="SimSun">连续</tspan><tspan font-family="Times New Roman">I/Q</tspan><tspan font-family="SimSun">软符号</tspan></text>
<text x="220" y="1175" xml:space="preserve" text-anchor="middle" font-size="27" fill="#000000"><tspan font-family="Times New Roman">{Q,I} 24 b · Q10</tspan></text>
<text x="220" y="1212" xml:space="preserve" text-anchor="middle" font-size="27" fill="#000000"><tspan font-family="SimSun">送入</tspan><tspan font-family="Times New Roman">DeepJSCC-Q</tspan><tspan font-family="SimSun">解码器</tspan></text>
<text x="700" y="1301" xml:space="preserve" text-anchor="middle" font-size="25" fill="#000000"><tspan font-family="SimSun">实线：</tspan><tspan font-family="Times New Roman">24 b I/Q</tspan><tspan font-family="SimSun">数据流</tspan><tspan font-family="Times New Roman">    </tspan><tspan font-family="SimSun">虚线：</tspan><tspan font-family="Times New Roman">SFO</tspan><tspan font-family="SimSun">残差反馈</tspan></text>
