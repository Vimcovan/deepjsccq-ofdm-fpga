<polygon points="245,790 250.0,778.0 240.0,778.0" fill="#000000"/>
<polyline points="430,885 515,885" fill="none" stroke="#000000" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="515,885 503.0,880.0 503.0,890.0" fill="#000000"/>
<polyline points="885,885 970,885" fill="none" stroke="#000000" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="970,885 958.0,880.0 958.0,890.0" fill="#000000"/>
<polyline points="1155,980 1155,1080" fill="none" stroke="#000000" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="1155,1080 1160.0,1068.0 1150.0,1068.0" fill="#000000"/>
<polyline points="970,1175 885,1175" fill="none" stroke="#000000" stroke-width="2.2" stroke-linejoin="round"/>
